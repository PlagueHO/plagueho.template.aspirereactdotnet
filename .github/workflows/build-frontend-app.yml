name: build-frontend-app

on:
    workflow_dispatch:
    pull_request:
        paths:
            - template-app/**

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: template-app
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install
            - run: pnpm build
