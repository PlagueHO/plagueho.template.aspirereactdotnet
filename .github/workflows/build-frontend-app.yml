name: build-frontend-app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - template-app/**

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template-app
    steps:
      - uses: actions/checkout@v6
      - name: Validate template tokens replaced
        run: pwsh ./scripts/Validate-TemplateTokens.ps1 -Mode Customized
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm build
