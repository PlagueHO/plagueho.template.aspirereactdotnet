name: build-backend-service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - template-service/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build template-service/{{PROJECT_NAMESPACE}}.slnx -c Release
