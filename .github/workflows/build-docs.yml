name: build-docs

on:
    workflow_dispatch:
    pull_request:
        paths:
            - docs/**

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: docs
        steps:
            - uses: actions/checkout@v7
            - name: Check if customized
              id: customized
              run: pwsh -Command "& ../scripts/Validate-TemplateTokens.ps1 -Mode Customized"
            - uses: pnpm/action-setup@v6
              if: steps.customized.outputs.status == 'customized'
              with:
                  version: 10
            - uses: actions/setup-node@v7
              if: steps.customized.outputs.status == 'customized'
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install
              if: steps.customized.outputs.status == 'customized'
            - run: pnpm docs:build
              if: steps.customized.outputs.status == 'customized'
